<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)" />
  <rect width="396" height="396" x="2" y="2" rx="30" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Neural Net Grid Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="50" x2="150" y2="120" />
    <line x1="150" y1="120" x2="250" y2="80" />
    <line x1="250" y1="80" x2="350" y2="160" />
    <line x1="80" y1="200" x2="180" y2="280" />
    <line x1="180" y1="280" x2="320" y2="220" />
    <circle cx="50" cy="50" r="3" fill="#00f2fe" />
    <circle cx="150" cy="120" r="4" fill="#3b82f6" />
    <circle cx="250" cy="80" r="3" fill="#8b5cf6" />
    <circle cx="350" cy="160" r="4" fill="#00f2fe" />
    <circle cx="180" cy="280" r="3" fill="#10b981" />
  </g>

  <!-- Glowing Aura -->
  <circle cx="200" cy="180" r="95" fill="url(#accentGrad)" opacity="0.12" filter="url(#glow)" />

  <!-- Stylized Tech Profile Avatar -->
  <!-- Head -->
  <circle cx="200" cy="160" r="55" fill="#172340" stroke="url(#accentGrad)" stroke-width="2.5" />
  <!-- Body/Shoulders -->
  <path d="M120 310 C120 240, 160 230, 200 230 C240 230, 280 240, 280 310 Z" fill="#172340" stroke="url(#accentGrad)" stroke-width="2" />
  
  <!-- Digital Visor / HUD element representing Computer Vision -->
  <rect x="165" y="145" width="70" height="14" rx="7" fill="#00f2fe" opacity="0.9" filter="url(#glow)" />
  <line x1="175" y1="152" x2="225" y2="152" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Tech Badges Overlay -->
  <g transform="translate(130, 335)">
    <rect width="140" height="30" rx="15" fill="#121c33" stroke="#00f2fe" stroke-width="1" />
    <text x="70" y="20" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">AI / ML ENGINEER</text>
  </g>
</svg>
