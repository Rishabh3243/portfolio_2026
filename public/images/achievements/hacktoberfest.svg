<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="hacktoberPaperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7EE" />
      <stop offset="100%" stop-color="#F2ECD8" />
    </linearGradient>
    <linearGradient id="hacktoberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B59A5A" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#hacktoberPaperBg)" />
  <rect width="396" height="236" x="2" y="2" rx="14" stroke="#DCD4BC" stroke-width="2" />

  <!-- Open Source Git Nodes & Global Contributor Emblem -->
  <g transform="translate(160, 20)">
    <!-- Outer Octagonal / Circular Frame -->
    <circle cx="40" cy="40" r="34" stroke="#405C3A" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <!-- Background Medal -->
    <circle cx="40" cy="40" r="30" fill="#E8E1C9" stroke="#DCD4BC" stroke-width="1.5" />
    <!-- Git Branch Path -->
    <path d="M30 52 V28 M30 36 C30 33 34 31 38 31 H42 C46 31 50 33 50 36 V48" fill="none" stroke="#405C3A" stroke-width="3" stroke-linecap="round" />
    <!-- Git Nodes / Commits -->
    <circle cx="30" cy="52" r="4.5" fill="#B59A5A" stroke="#FAF7EE" stroke-width="1.5" />
    <circle cx="30" cy="28" r="4.5" fill="#405C3A" stroke="#FAF7EE" stroke-width="1.5" />
    <circle cx="50" cy="48" r="4.5" fill="#B59A5A" stroke="#FAF7EE" stroke-width="1.5" />
    <!-- Mini Star at top -->
    <polygon points="40,16 42,21 47,21 43,24 45,29 40,26 35,29 37,24 33,21 38,21" fill="#B59A5A" />
  </g>

  <text x="200" y="132" fill="#39402F" font-family="'DM Sans', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Global Contributor — Hacktoberfest</text>
  <rect x="95" y="146" width="210" height="22" rx="6" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1" />
  <text x="200" y="161" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">DigitalOcean &bull; GitHub &bull; Docker</text>
  <text x="200" y="190" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Ranked in Top 40,000 Worldwide</text>
  <text x="200" y="210" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">5 Merged Pull Requests Across Global Open-Source Repos</text>
</svg>