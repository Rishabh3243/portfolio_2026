<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Gold Gradient for Cup Body -->
    <linearGradient id="goldCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#B59A5A" />
      <stop offset="100%" stop-color="#8C7335" />
    </linearGradient>

    <!-- Specular Highlight Reflection -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#FAF7EE" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
    </linearGradient>

    <!-- Base Pedestal Gradient -->
    <linearGradient id="baseGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#506B42" />
      <stop offset="50%" stop-color="#405C3A" />
      <stop offset="100%" stop-color="#2D4129" />
    </linearGradient>

    <!-- Laurel Leaves Gradient -->
    <linearGradient id="laurelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A9A62" />
      <stop offset="100%" stop-color="#405C3A" />
    </linearGradient>

    <!-- Soft Backdrop Circle -->
    <radialGradient id="badgeBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF7EE" />
      <stop offset="70%" stop-color="#F2ECD8" />
      <stop offset="100%" stop-color="#E2D9BC" />
    </radialGradient>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="80" cy="80" r="76" fill="url(#badgeBackdrop)" />
  <circle cx="80" cy="80" r="75" stroke="#B59A5A" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
  <circle cx="80" cy="80" r="70" stroke="#DCD4BC" stroke-width="1" />

  <!-- Laurel Wreath Leaves (Left & Right framing) -->
  <g fill="url(#laurelGrad)" opacity="0.95">
    <!-- Left Branch Stem -->
    <path d="M42 108 C36 94 36 76 46 60" fill="none" stroke="#405C3A" stroke-width="2" stroke-linecap="round" />
    <!-- Left Leaves -->
    <path d="M42 108 C38 104 34 100 37 96 C40 92 44 98 42 108 Z" />
    <path d="M38 95 C33 92 29 87 33 83 C37 79 40 86 38 95 Z" />
    <path d="M36 82 C30 80 27 74 32 70 C37 66 39 74 36 82 Z" />
    <path d="M38 69 C33 66 32 60 37 57 C42 54 43 62 38 69 Z" />
    <path d="M45 58 C41 53 43 47 48 46 C53 45 51 52 45 58 Z" />

    <!-- Right Branch Stem -->
    <path d="M118 108 C124 94 124 76 114 60" fill="none" stroke="#405C3A" stroke-width="2" stroke-linecap="round" />
    <!-- Right Leaves -->
    <path d="M118 108 C122 104 126 100 123 96 C120 92 116 98 118 108 Z" />
    <path d="M122 95 C127 92 131 87 127 83 C123 79 120 86 122 95 Z" />
    <path d="M124 82 C130 80 133 74 128 70 C123 66 121 74 124 82 Z" />
    <path d="M122 69 C127 66 128 60 123 57 C118 54 117 62 122 69 Z" />
    <path d="M115 58 C119 53 117 47 112 46 C107 45 109 52 115 58 Z" />
  </g>

  <!-- Trophy Handles -->
  <!-- Left Handle -->
  <path d="M58 44 C38 44 32 58 38 72 C44 84 54 86 60 86" fill="none" stroke="url(#goldCup)" stroke-width="5" stroke-linecap="round" />
  <path d="M58 44 C40 44 35 58 40 70 C45 80 54 84 58 84" fill="none" stroke="#FAF7EE" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

  <!-- Right Handle -->
  <path d="M102 44 C122 44 128 58 122 72 C116 84 106 86 100 86" fill="none" stroke="url(#goldCup)" stroke-width="5" stroke-linecap="round" />
  <path d="M102 44 C120 44 125 58 120 70 C115 80 106 84 102 84" fill="none" stroke="#FAF7EE" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

  <!-- Trophy Cup Body -->
  <path d="M56 34 H104 C104 64 94 82 80 88 C66 82 56 64 56 34 Z" fill="url(#goldCup)" />
  <!-- Shiny overlay -->
  <path d="M56 34 H104 C104 64 94 82 80 88 C66 82 56 64 56 34 Z" fill="url(#goldShine)" />

  <!-- Cup Lip / Rim -->
  <ellipse cx="80" cy="34" rx="25" ry="5" fill="#F9E79F" />
  <ellipse cx="80" cy="34" rx="23" ry="3.5" fill="#B59A5A" />
  <ellipse cx="80" cy="33" rx="21" ry="2" fill="#FAF7EE" opacity="0.85" />

  <!-- "1" Emblem Medallion on Cup -->
  <g transform="translate(80, 57)">
    <circle cx="0" cy="0" r="13" fill="#344C30" opacity="0.95" />
    <circle cx="0" cy="0" r="11.5" fill="none" stroke="#F9E79F" stroke-width="1" />
    <text x="0" y="4.5" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#F9E79F" text-anchor="middle">1</text>
  </g>

  <!-- Cup Stem -->
  <path d="M74 88 H86 V98 H74 Z" fill="url(#goldCup)" />
  <path d="M72 98 H88 V102 H72 Z" fill="#D4AF37" />

  <!-- Pedestal Base -->
  <path d="M60 102 H100 L104 126 H56 L60 102 Z" fill="url(#baseGreen)" />
  <rect x="52" y="126" width="56" height="6" rx="2" fill="#253622" />

  <!-- Gold Plaque on Base -->
  <rect x="61" y="108" width="38" height="13" rx="2" fill="url(#goldCup)" stroke="#F9E79F" stroke-width="0.75" />
  <text x="80" y="117.5" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="bold" fill="#253622" text-anchor="middle" letter-spacing="0.5">SIH 2023</text>

  <!-- Sparkles / Celebratory Stars -->
  <g fill="#F9E79F">
    <!-- Sparkle Left -->
    <path d="M46 30 Q46 36 40 36 Q46 36 46 42 Q46 36 52 36 Q46 36 46 30 Z" />
    <!-- Sparkle Right -->
    <path d="M116 26 Q116 32 110 32 Q116 32 116 38 Q116 32 122 32 Q116 32 116 26 Z" />
    <circle cx="114" cy="46" r="1.5" fill="#FFFFFF" />
    <circle cx="48" cy="48" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
