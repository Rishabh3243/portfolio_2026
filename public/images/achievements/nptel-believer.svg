<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="believerPaperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7EE" />
      <stop offset="100%" stop-color="#F2ECD8" />
    </linearGradient>
    <linearGradient id="believerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B59A5A" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#believerPaperBg)" />
  <rect width="396" height="236" x="2" y="2" rx="14" stroke="#DCD4BC" stroke-width="2" />

  <!-- Multi-Semester Excellence Star Badge -->
  <g transform="translate(160, 20)">
    <!-- Radiating Rays -->
    <circle cx="40" cy="40" r="34" stroke="#B59A5A" stroke-width="1" stroke-dasharray="2 3" opacity="0.7" />
    <!-- Golden Star -->
    <polygon points="40,8 49,27 70,30 55,45 58,66 40,56 22,66 25,45 10,30 31,27" fill="url(#believerGold)" />
    <!-- Center Green Badge with "★" and laurel ring -->
    <circle cx="40" cy="38" r="17" fill="#405C3A" stroke="#FAF7EE" stroke-width="1.5" />
    <text x="40" y="44" fill="#FAF7EE" font-family="'DM Sans', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">&#9733;</text>
  </g>

  <text x="200" y="132" fill="#39402F" font-family="'DM Sans', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">NPTEL Star — Believer</text>
  <rect x="100" y="146" width="200" height="22" rx="6" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1" />
  <text x="200" y="161" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">NPTEL / IIT Madras &bull; 2022 &amp; 2023</text>
  <text x="200" y="190" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Multi-Semester Academic Consistency</text>
  <text x="200" y="210" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Continuous High Performance Across Consecutive Semesters</text>
</svg>