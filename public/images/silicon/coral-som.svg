<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <rect width="160" height="120" rx="14" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="2"/>
  
  <!-- Coral SOM Solder-down Board -->
  <rect x="35" y="20" width="90" height="80" rx="6" fill="#39402F" stroke="#405C3A" stroke-width="2"/>
  
  <!-- Edge TPU Shielding Can -->
  <rect x="45" y="30" width="70" height="60" rx="4" fill="#FAF7EE" stroke="#B59A5A" stroke-width="1.5"/>
  <text x="80" y="55" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">GOOGLE</text>
  <text x="80" y="70" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">CORAL EDGE TPU</text>
  
  <rect x="52" y="76" width="56" height="10" rx="2" fill="#B59A5A"/>
  <text x="80" y="84" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="bold" text-anchor="middle">4 TOPS &bull; INT8 ASIC</text>
  
  <!-- Castellation solder pads -->
  <g fill="#B59A5A">
    <circle cx="40" cy="20" r="2.5"/>
    <circle cx="50" cy="20" r="2.5"/>
    <circle cx="60" cy="20" r="2.5"/>
    <circle cx="70" cy="20" r="2.5"/>
    <circle cx="80" cy="20" r="2.5"/>
    <circle cx="90" cy="20" r="2.5"/>
    <circle cx="100" cy="20" r="2.5"/>
    <circle cx="110" cy="20" r="2.5"/>
    <circle cx="120" cy="20" r="2.5"/>

    <circle cx="40" cy="100" r="2.5"/>
    <circle cx="50" cy="100" r="2.5"/>
    <circle cx="60" cy="100" r="2.5"/>
    <circle cx="70" cy="100" r="2.5"/>
    <circle cx="80" cy="100" r="2.5"/>
    <circle cx="90" cy="100" r="2.5"/>
    <circle cx="100" cy="100" r="2.5"/>
    <circle cx="110" cy="100" r="2.5"/>
    <circle cx="120" cy="100" r="2.5"/>
