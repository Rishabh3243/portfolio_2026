<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="16" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="2"/>
  
  <!-- PCB Baseboard -->
  <rect x="14" y="18" width="92" height="84" rx="8" fill="#405C3A" stroke="#344C30" stroke-width="2"/>
  
  <!-- Mounting Holes -->
  <circle cx="22" cy="26" r="3.5" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="1.5"/>
  <circle cx="98" cy="26" r="3.5" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="1.5"/>
  <circle cx="22" cy="94" r="3.5" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="1.5"/>
  <circle cx="98" cy="94" r="3.5" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="1.5"/>
  
  <!-- Main Processor SoC on board -->
  <rect x="42" y="44" width="34" height="34" rx="4" fill="#39402F" stroke="#B59A5A" stroke-width="1.5"/>
  <text x="59" y="64" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">SBC</text>
  
  <!-- Ports: Ethernet / USB -->
  <rect x="10" y="38" width="10" height="20" rx="2" fill="#E8E1C9" stroke="#8A9A62" stroke-width="1"/>
  <rect x="10" y="64" width="10" height="20" rx="2" fill="#E8E1C9" stroke="#8A9A62" stroke-width="1"/>
  
  <!-- HDMI / Type-C -->
  <rect x="46" y="96" width="16" height="8" rx="2" fill="#E8E1C9" stroke="#8A9A62" stroke-width="1"/>
  <rect x="68" y="96" width="12" height="8" rx="2" fill="#E8E1C9" stroke="#8A9A62" stroke-width="1"/>
  
  <!-- 40-pin GPIO Header Array -->
  <g fill="#B59A5A">
    <rect x="32" y="24" width="3" height="3" rx="0.5"/>
    <rect x="38" y="24" width="3" height="3" rx="0.5"/>
    <rect x="44" y="24" width="3" height="3" rx="0.5"/>
    <rect x="50" y="24" width="3" height="3" rx="0.5"/>
    <rect x="56" y="24" width="3" height="3" rx="0.5"/>
    <rect x="62" y="24" width="3" height="3" rx="0.5"/>
    <rect x="68" y="24" width="3" height="3" rx="0.5"/>
    <rect x="74" y="24" width="3" height="3" rx="0.5"/>
    <rect x="80" y="24" width="3" height="3" rx="0.5"/>
    
    <rect x="32" y="30" width="3" height="3" rx="0.5"/>
    <rect x="38" y="30" width="3" height="3" rx="0.5"/>
    <rect x="44" y="30" width="3" height="3" rx="0.5"/>
    <rect x="50" y="30" width="3" height="3" rx="0.5"/>
    <rect x="56" y="30" width="3" height="3" rx="0.5"/>
    <rect x="62" y="30" width="3" height="3" rx="0.5"/>
    <rect x="68" y="30" width="3" height="3" rx="0.5"/>
    <rect x="74" y="30" width="3" height="3" rx="0.5"/>
    <rect x="80" y="30" width="3" height="3" rx="0.5"/>
  </g>
  
  <!-- Board Label -->
  <text x="60" y="115" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">SINGLE BOARD</text>
</svg>
