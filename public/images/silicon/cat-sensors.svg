<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="16" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="2"/>
  
  <!-- Camera Sensor Module Substrate -->
  <rect x="22" y="20" width="76" height="76" rx="10" fill="#E8E1C9" stroke="#405C3A" stroke-width="2"/>
  
  <!-- Optical Ring / Lens Mount -->
  <circle cx="60" cy="54" r="28" fill="#39402F" stroke="#B59A5A" stroke-width="2"/>
  <circle cx="60" cy="54" r="22" fill="#344C30" stroke="#8A9A62" stroke-width="1.5"/>
  <circle cx="60" cy="54" r="16" fill="#405C3A"/>
  
  <!-- CMOS Photodiode Active Pixel Array with grid pattern -->
  <rect x="51" y="45" width="18" height="18" rx="2" fill="#B59A5A" opacity="0.9"/>
  <line x1="51" y1="51" x2="69" y2="51" stroke="#FAF7EE" stroke-width="0.75"/>
  <line x1="51" y1="57" x2="69" y2="57" stroke="#FAF7EE" stroke-width="0.75"/>
  <line x1="57" y1="45" x2="57" y2="63" stroke="#FAF7EE" stroke-width="0.75"/>
  <line x1="63" y1="45" x2="63" y2="63" stroke="#FAF7EE" stroke-width="0.75"/>
  
  <!-- Lens reflection arc -->
  <path d="M48 42 A 16 16 0 0 1 70 42" stroke="#FAF7EE" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Flexible Ribbon Cable / MIPI Connector -->
  <rect x="42" y="96" width="36" height="12" rx="2" fill="#B59A5A" stroke="#8A9A62" stroke-width="1"/>
  <line x1="48" y1="96" x2="48" y2="108" stroke="#39402F" stroke-width="1.5"/>
  <line x1="54" y1="96" x2="54" y2="108" stroke="#39402F" stroke-width="1.5"/>
  <line x1="60" y1="96" x2="60" y2="108" stroke="#39402F" stroke-width="1.5"/>
  <line x1="66" y1="96" x2="66" y2="108" stroke="#39402F" stroke-width="1.5"/>
  <line x1="72" y1="96" x2="72" y2="108" stroke="#39402F" stroke-width="1.5"/>
  
  <!-- Label -->
  <text x="60" y="116" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">AI SENSORS</text>
</svg>
