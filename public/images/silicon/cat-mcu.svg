<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="16" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="2"/>
  
  <!-- QFP / QFN Microcontroller Package Body -->
  <rect x="30" y="30" width="60" height="60" rx="8" fill="#39402F" stroke="#405C3A" stroke-width="2"/>
  
  <!-- Pin 1 Index Dot -->
  <circle cx="38" cy="38" r="3" fill="#B59A5A"/>
  
  <!-- Core Silicon Branding -->
  <rect x="42" y="44" width="36" height="32" rx="4" fill="#405C3A" stroke="#8A9A62" stroke-width="1"/>
  <text x="60" y="58" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">MCU</text>
  <text x="60" y="68" fill="#E8E1C9" font-family="'JetBrains Mono', monospace" font-size="6" text-anchor="middle">TINYML</text>
  
  <!-- Perimeter IC Lead Pins (Top, Bottom, Left, Right) -->
  <!-- Left Pins -->
  <line x1="16" y1="40" x2="30" y2="40" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="48" x2="30" y2="48" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="56" x2="30" y2="56" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="64" x2="30" y2="64" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="72" x2="30" y2="72" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="80" x2="30" y2="80" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Right Pins -->
  <line x1="90" y1="40" x2="104" y2="40" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="48" x2="104" y2="48" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="56" x2="104" y2="56" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="64" x2="104" y2="64" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="72" x2="104" y2="72" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="90" y1="80" x2="104" y2="80" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Top Pins -->
  <line x1="40" y1="16" x2="40" y2="30" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="16" x2="48" y2="30" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="16" x2="56" y2="30" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="16" x2="64" y2="30" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="16" x2="72" y2="30" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="16" x2="80" y2="30" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bottom Pins -->
  <line x1="40" y1="90" x2="40" y2="104" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="48" y1="90" x2="48" y2="104" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="90" x2="56" y2="104" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="90" x2="64" y2="104" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="72" y1="90" x2="72" y2="104" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="80" y1="90" x2="80" y2="104" stroke="#B59A5A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Label -->
  <text x="60" y="115" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">MICROCONTROLLER</text>
</svg>
