<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <rect width="160" height="120" rx="14" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="2"/>
  
  <!-- Green PCB Board -->
  <rect x="20" y="15" width="120" height="90" rx="8" fill="#405C3A" stroke="#344C30" stroke-width="2"/>
  
  <!-- Mounting holes -->
  <circle cx="28" cy="23" r="3" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="1"/>
  <circle cx="132" cy="23" r="3" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="1"/>
  <circle cx="28" cy="97" r="3" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="1"/>
  <circle cx="132" cy="97" r="3" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="1"/>
  
  <!-- Ports: Ethernet & USB stack -->
  <rect x="15" y="32" width="10" height="24" rx="2" fill="#E8E1C9" stroke="#8A9A62" stroke-width="1"/>
  <rect x="15" y="62" width="10" height="24" rx="2" fill="#E8E1C9" stroke="#8A9A62" stroke-width="1"/>
  
  <!-- Broadcom SoC center -->
  <rect x="55" y="42" width="38" height="36" rx="4" fill="#39402F" stroke="#B59A5A" stroke-width="1.5"/>
  <text x="74" y="58" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">RPI 5</text>
  <text x="74" y="70" fill="#B59A5A" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold" text-anchor="middle">BCM2712</text>
  
  <!-- 40-pin GPIO strip -->
  <rect x="42" y="20" width="70" height="7" rx="1" fill="#B59A5A"/>
  
  <!-- Dual Micro HDMI & PCIe -->
  <rect x="50" y="98" width="14" height="6" rx="1" fill="#E8E1C9"/>
  <rect x="70" y="98" width="14" height="6" rx="1" fill="#E8E1C9"/>
  <rect x="90" y="98" width="18" height="5" rx="1" fill="#FAF7EE"/>
</svg>
