<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <rect width="120" height="120" rx="16" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="2"/>
  
  <!-- Outer GPU Package -->
  <rect x="20" y="20" width="80" height="80" rx="10" fill="#E8E1C9" stroke="#405C3A" stroke-width="2"/>
  <circle cx="28" cy="28" r="3" fill="#405C3A"/>
  
  <!-- GPU Parallel Core Die -->
  <rect x="32" y="32" width="56" height="56" rx="6" fill="#39402F" stroke="#506B42" stroke-width="1.5"/>
  
  <!-- Streaming Multiprocessor / CUDA Core Array (Matrix of compute shader cores) -->
  <g fill="#506B42" stroke="#8A9A62" stroke-width="0.75">
    <rect x="37" y="37" width="9" height="9" rx="1.5"/>
    <rect x="49" y="37" width="9" height="9" rx="1.5"/>
    <rect x="61" y="37" width="9" height="9" rx="1.5"/>
    <rect x="73" y="37" width="9" height="9" rx="1.5"/>
    
    <rect x="37" y="49" width="9" height="9" rx="1.5"/>
    <!-- Tensor Core Highlight -->
    <rect x="49" y="49" width="9" height="9" rx="1.5" fill="#B59A5A" stroke="#FAF7EE"/>
    <rect x="61" y="49" width="9" height="9" rx="1.5" fill="#B59A5A" stroke="#FAF7EE"/>
    <rect x="73" y="49" width="9" height="9" rx="1.5"/>
    
    <rect x="37" y="61" width="9" height="9" rx="1.5"/>
    <rect x="49" y="61" width="9" height="9" rx="1.5" fill="#B59A5A" stroke="#FAF7EE"/>
    <rect x="61" y="61" width="9" height="9" rx="1.5" fill="#B59A5A" stroke="#FAF7EE"/>
    <rect x="73" y="61" width="9" height="9" rx="1.5"/>

    <rect x="37" y="73" width="9" height="9" rx="1.5"/>
    <rect x="49" y="73" width="9" height="9" rx="1.5"/>
    <rect x="61" y="73" width="9" height="9" rx="1.5"/>
    <rect x="73" y="73" width="9" height="9" rx="1.5"/>
  </g>
  
  <!-- Tensor core label overlay -->
  <rect x="45" y="55" width="30" height="10" rx="3" fill="#39402F" stroke="#B59A5A" stroke-width="1"/>
  <text x="60" y="63" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="6" font-weight="bold" text-anchor="middle">TENSOR</text>

  <!-- High bandwidth traces -->
  <line x1="10" y1="45" x2="20" y2="45" stroke="#405C3A" stroke-width="2"/>
  <line x1="10" y1="75" x2="20" y2="75" stroke="#405C3A" stroke-width="2"/>
  <line x1="100" y1="45" x2="110" y2="45" stroke="#405C3A" stroke-width="2"/>
  <line x1="100" y1="75" x2="110" y2="75" stroke="#405C3A" stroke-width="2"/>
  
  <!-- Subtitle -->
  <text x="60" y="112" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" text-anchor="middle">GPU &bull; CUDA / TENSOR</text>
</svg>
