    <rect x="136" y="0" width="122" height="150" rx="10" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1.5" />
    <rect x="148" y="14" width="98" height="22" rx="6" fill="#506B42" />
    <text x="197" y="29" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">NXP i.MX 8M</text>
    <text x="197" y="55" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">2.3 TOPS NPU</text>
    <rect x="148" y="70" width="98" height="26" rx="6" fill="#FAF7EE" stroke="#D4CCA8" stroke-width="1" />
    <text x="197" y="86" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">eIQ / ARM NN</text>
