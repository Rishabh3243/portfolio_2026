  <!-- Bottom Pipeline Ribbon -->
  <g transform="translate(35, 248)">
    <rect x="0" y="0" width="530" height="75" rx="10" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="1" />
    <text x="20" y="26" fill="#39402F" font-family="'DM Sans', sans-serif" font-size="12" font-weight="bold">Multi-Camera Ingestion &bull; RTSP &bull; CSI &bull; MIPI &bull; USB</text>
    <text x="20" y="48" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="10">Quantized YOLOv8 + PaddleOCR &bull; End-to-End Realtime Inference on Embedded Linux</text>
    <rect x="425" y="20" width="85" height="35" rx="8" fill="#405C3A" />
    <text x="467" y="42" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">PRODUCTION</text>
  </g>
