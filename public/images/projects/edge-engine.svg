    <text x="197" y="124" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">-50% Memory RAM</text>

    <!-- Platform 3: Rockchip RK3588 -->
    <rect x="272" y="0" width="122" height="150" rx="10" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1.5" />
    <rect x="284" y="14" width="98" height="22" rx="6" fill="#405C3A" />
    <text x="333" y="29" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">Rockchip NPU</text>
    <text x="333" y="55" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">RK3588 Tri-Core</text>
    <rect x="284" y="70" width="98" height="26" rx="6" fill="#FAF7EE" stroke="#D4CCA8" stroke-width="1" />
    <text x="333" y="86" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">RKNN Toolkit 2</text>
    <rect x="284" y="106" width="98" height="28" rx="6" fill="#E8E1C9" stroke="#8A9A62" stroke-width="1" />
    <text x="333" y="124" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">Zero Drops 60fps</text>

    <!-- Platform 4: Axelera AI Metis -->
    <rect x="408" y="0" width="122" height="150" rx="10" fill="#E8E1C9" stroke="#B59A5A" stroke-width="1.5" />
    <rect x="420" y="14" width="98" height="22" rx="6" fill="#B59A5A" />
    <text x="469" y="29" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">Axelera Metis</text>
    <text x="469" y="55" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">214 TOPS D-IMC</text>
    <rect x="420" y="70" width="98" height="26" rx="6" fill="#FAF7EE" stroke="#D4CCA8" stroke-width="1" />
    <text x="469" y="86" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">Voyager SDK</text>
    <rect x="420" y="106" width="98" height="28" rx="6" fill="#FAF7EE" stroke="#B59A5A" stroke-width="1" />
    <text x="469" y="124" fill="#344C30" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">Showcase Expo</text>
