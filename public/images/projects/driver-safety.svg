<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="dPaperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7EE" />
      <stop offset="100%" stop-color="#F2ECD8" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#dPaperBg)" />
  <rect width="596" height="356" x="2" y="2" rx="14" stroke="#DCD4BC" stroke-width="2" />

  <!-- Camera Ingestion HUD -->
  <g transform="translate(30, 25)">
    <!-- Video Feed Frame -->
    <rect width="320" height="230" rx="10" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1.5" />
    
    <!-- Face Bounding Box -->
    <rect x="70" y="35" width="170" height="160" rx="8" fill="#FAF7EE" stroke="#405C3A" stroke-width="2" stroke-dasharray="6 3" />
    <rect x="70" y="15" width="145" height="22" rx="6" fill="#405C3A" />
    <text x="142" y="30" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">DRIVER_FACE: 0.98</text>

    <!-- Facial Landmark Points -->
    <!-- Eyes -->
    <circle cx="120" cy="90" r="4" fill="#405C3A" />
    <circle cx="132" cy="90" r="4" fill="#405C3A" />
    <circle cx="178" cy="90" r="4" fill="#405C3A" />
    <circle cx="190" cy="90" r="4" fill="#405C3A" />
    <ellipse cx="126" cy="90" rx="14" ry="7" fill="none" stroke="#405C3A" stroke-width="1.5" />
    <ellipse cx="184" cy="90" rx="14" ry="7" fill="none" stroke="#405C3A" stroke-width="1.5" />

    <!-- Nose & Mouth -->
    <path d="M155 98 L152 120 L158 120" stroke="#8A9A62" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M136 145 Q155 158 174 145" stroke="#405C3A" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Live Telemetry Tag -->
    <rect x="15" y="195" width="125" height="22" rx="6" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1" />
    <text x="77" y="210" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">EAR METRIC: 0.32</text>
  </g>

  <!-- Right Telemetry & Status Column -->
  <g transform="translate(370, 25)">
    <!-- Status Card: Attentive -->
    <rect width="200" height="70" rx="10" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1.5" />
    <circle cx="25" cy="25" r="10" fill="#405C3A" />
    <text x="25" y="29" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">&#x2713;</text>
    <text x="45" y="24" fill="#39402F" font-family="'DM Sans', sans-serif" font-size="12" font-weight="bold">Driver State: Alert</text>
    <text x="45" y="42" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="9">Head Pose: Forward (0.2&deg;)</text>
    <text x="45" y="58" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">Drowsiness: None (0.02)</text>

    <!-- Metrics Card -->
    <rect y="82" width="200" height="173" rx="10" fill="#FAF7EE" stroke="#DCD4BC" stroke-width="1.5" />
    <text x="18" y="106" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">TELEMETRY BENCHMARK</text>
    
    <g transform="translate(18, 120)">
      <text x="0" y="0" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="9">FPS Rate</text>
      <text x="164" y="0" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="end">45 FPS</text>
      <rect y="6" width="164" height="5" rx="2.5" fill="#E8E1C9" />
      <rect y="6" width="145" height="5" rx="2.5" fill="#405C3A" />

      <text x="0" y="30" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="9">Latency</text>
      <text x="164" y="30" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="end">22 ms</text>
      <rect y="36" width="164" height="5" rx="2.5" fill="#E8E1C9" />
      <rect y="36" width="120" height="5" rx="2.5" fill="#506B42" />

      <text x="0" y="60" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="9">Blink Freq</text>
      <text x="164" y="60" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="end">14 / min</text>
      <rect y="66" width="164" height="5" rx="2.5" fill="#E8E1C9" />
      <rect y="66" width="90" height="5" rx="2.5" fill="#8A9A62" />
    </g>

    <rect x="18" y="208" width="164" height="32" rx="6" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1" />
    <text x="100" y="228" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">REAL-TIME EDGE VISION</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(30, 275)">
    <rect width="540" height="50" rx="8" fill="#E8E1C9" stroke="#DCD4BC" stroke-width="1" />
    <text x="20" y="24" fill="#39402F" font-family="'DM Sans', sans-serif" font-size="11" font-weight="bold">Eye Aspect Ratio (EAR) &bull; OpenCV Video Ingestion &bull; Facial Landmark Pipeline</text>
    <text x="20" y="40" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="9">Automated Dataset Scraping &bull; Lightweight Neural Feature Extraction &bull; Edunet Foundation</text>
  </g>
</svg>
