<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7EE" />
      <stop offset="100%" stop-color="#F2ECD8" />
    </linearGradient>
  </defs>

  <!-- Base Paper Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#paperBg)" />
  <rect width="596" height="356" x="2" y="2" rx="14" stroke="#DCD4BC" stroke-width="2" />

  <!-- Subtle grid pattern -->
  <g stroke="#E0D7BE" stroke-width="0.75" stroke-dasharray="2 4">
    <line x1="40" y1="60" x2="560" y2="60" />
    <line x1="40" y1="120" x2="560" y2="120" />
    <line x1="40" y1="180" x2="560" y2="180" />
    <line x1="40" y1="240" x2="560" y2="240" />
    <line x1="40" y1="300" x2="560" y2="300" />
  </g>

  <!-- Header Banner -->
  <g transform="translate(40, 24)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#405C3A" />
    <text x="24" y="16" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">LOCAL RAG SYSTEM</text>
    <text x="145" y="16" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="10">Adaptive Semantic Router</text>
  </g>

  <!-- Technical RAG Architecture Nodes -->
  <g transform="translate(40, 68)">
    <!-- Document Card -->
    <rect x="0" y="30" width="105" height="135" rx="10" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1.5" />
    <rect x="15" y="45" width="40" height="8" rx="4" fill="#405C3A" opacity="0.8" />
    <line x1="15" y1="68" x2="90" y2="68" stroke="#8A9A62" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="84" x2="80" y2="84" stroke="#D4CCA8" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="100" x2="70" y2="100" stroke="#D4CCA8" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="116" x2="85" y2="116" stroke="#D4CCA8" stroke-width="2" stroke-linecap="round" />
    <text x="52" y="148" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">LocalDoc PDF</text>

    <!-- Flow Arrow 1 -->
    <path d="M115 95 H155" stroke="#405C3A" stroke-width="2" stroke-dasharray="4 4" />
    <polygon points="155,91 163,95 155,99" fill="#405C3A" />

    <!-- Vector DB / ChromaDB Node -->
    <rect x="175" y="15" width="145" height="160" rx="12" fill="#FAF7EE" stroke="#405C3A" stroke-width="1.5" />
    <circle cx="247" cy="55" r="22" fill="#E8E1C9" stroke="#8A9A62" stroke-width="1.5" />
    <!-- Database cylinders -->
    <ellipse cx="247" cy="50" rx="12" ry="4" fill="#405C3A" />
    <ellipse cx="247" cy="55" rx="12" ry="4" fill="#506B42" />
    <ellipse cx="247" cy="60" rx="12" ry="4" fill="#8A9A62" />
    <text x="247" y="92" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">ChromaDB Store</text>
    <text x="247" y="112" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Semantic Chunking</text>
    <rect x="195" y="125" width="105" height="20" rx="6" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1" />
    <text x="247" y="139" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">Cosine Sim: 0.89</text>

    <!-- Flow Arrow 2 -->
    <path d="M330 95 H370" stroke="#405C3A" stroke-width="2" stroke-dasharray="4 4" />
    <polygon points="370,91 378,95 370,99" fill="#405C3A" />

    <!-- Local LLM Engine -->
    <rect x="390" y="30" width="130" height="135" rx="10" fill="#E8E1C9" stroke="#B59A5A" stroke-width="1.5" />
    <rect x="405" y="45" width="100" height="22" rx="6" fill="#B59A5A" />
    <text x="455" y="60" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">Local LLM 360M</text>
    <text x="455" y="90" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">Dual-Layer Memory</text>
    <text x="455" y="108" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Rolling Context</text>
    <rect x="405" y="124" width="100" height="22" rx="6" fill="#FAF7EE" stroke="#D4CCA8" stroke-width="1" />
    <text x="455" y="139" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">Latency: 18ms</text>
  </g>

  <!-- Bottom Verification Console Badge -->
  <g transform="translate(40, 275)">
    <rect x="0" y="0" width="520" height="50" rx="10" fill="#E8E1C9" stroke="#DCD4BC" stroke-width="1" />
    <circle cx="25" cy="25" r="8" fill="#405C3A" />
    <text x="25" y="29" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">&#x2713;</text>
    <text x="45" y="23" fill="#39402F" font-family="'DM Sans', sans-serif" font-size="12" font-weight="bold">Grounding Verification</text>
    <text x="45" y="38" fill="#77745F" font-family="'JetBrains Mono', monospace" font-size="10">Threshold-based query routing eliminating hallucination on edge compute</text>
    <rect x="430" y="14" width="75" height="22" rx="6" fill="#405C3A" />
    <text x="467" y="29" fill="#FAF7EE" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">VERIFIED</text>
  </g>
</svg>
