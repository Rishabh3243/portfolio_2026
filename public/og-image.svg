<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="ogPaperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7EE" />
      <stop offset="100%" stop-color="#E8E1C9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogPaperBg)" />
  <rect x="24" y="24" width="1152" height="582" rx="28" stroke="#DCD4BC" stroke-width="3" />

  <!-- Subtle botanical / paper motif -->
  <g opacity="0.3" stroke="#8A9A62" stroke-width="1.5" stroke-dasharray="3 6">
    <circle cx="950" cy="315" r="220" />
    <circle cx="950" cy="315" r="140" />
    <circle cx="950" cy="315" r="70" />
  </g>

  <!-- Content Group -->
  <g transform="translate(100, 140)">
    <!-- Monogram Badge -->
    <rect width="70" height="70" rx="20" fill="#405C3A" />
    <text x="35" y="44" fill="#F6F0DC" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" text-anchor="middle">RP</text>

    <!-- Name & Title -->
    <text x="95" y="48" fill="#39402F" font-family="'DM Sans', sans-serif" font-size="44" font-weight="bold">Rishabh Parmar</text>
    <text x="0" y="125" fill="#405C3A" font-family="'JetBrains Mono', monospace" font-size="26" font-weight="bold">AI/ML Developer &bull; Edge AI Engineer</text>
    
    <text x="0" y="175" fill="#77745F" font-family="'DM Sans', sans-serif" font-size="20">
      Computer Vision &bull; Edge AI &bull; Generative AI &bull; LLMs &bull; Autonomous AI Agents
    </text>

    <!-- Chips / Silicon Tags -->
    <g transform="translate(0, 220)">
      <rect width="150" height="42" rx="10" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1.5" />
      <text x="75" y="27" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">NVIDIA Jetson</text>

      <rect x="165" width="150" height="42" rx="10" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1.5" />
      <text x="240" y="27" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">NXP i.MX 8M</text>

      <rect x="330" width="140" height="42" rx="10" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1.5" />
      <text x="400" y="27" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">TensorRT</text>

      <rect x="485" width="140" height="42" rx="10" fill="#E8E1C9" stroke="#D4CCA8" stroke-width="1.5" />
      <text x="555" y="27" fill="#39402F" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">Local RAG</text>

      <rect x="640" width="160" height="42" rx="10" fill="#405C3A" />
      <text x="720" y="27" fill="#F6F0DC" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">SIH 2023 Winner</text>
    </g>
  </g>
</svg>
